plugins { id 'com.android.application' }
android {
    namespace 'cn.family.acecaptain'
    compileSdk 35
    defaultConfig {
        applicationId 'cn.family.acecaptain'
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName '1.1.0'
        def serverUrl = project.findProperty('serverUrl') ?: ''
        if (serverUrl && !(serverUrl ==~ /https:\/\/[A-Za-z0-9.-]+(:[0-9]+)?/)) {
            throw new GradleException('serverUrl must be an HTTPS origin with no path')
        }
        buildConfigField 'String', 'DEFAULT_SERVER_URL', '"' + serverUrl + '"'
    }
    buildFeatures { buildConfig true }
    buildTypes {
        debug { applicationIdSuffix '.debug' }
        release { minifyEnabled false }
    }
}
